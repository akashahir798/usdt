services:
  - type: web
    name: usdt-portfolio-tracker
    env: python
    pythonVersion: "3.12"
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: REMEMBER_COOKIE_SECURE
        value: "true"
      - key: FLASK_ENV
        value: "production"
      - key: FLASK_DEBUG
        value: "0"
    healthCheckPath: /
    autoDeploy: true